spring:
  application:
    name: xksms-auth
  profiles:
    active: @spring.profiles.active@
  config:
    import:
      - optional:classpath:observability-default.yml
      - optional:classpath:redis-default.yml
      - optional:classpath:cache-default.yml

server:
  servlet:
    context-path: /
  shutdown: graceful
  port: 9999

logging:
  config: classpath:logback-spring.xml

logstash:
  host: 192.168.2.10
  port: 5044

xksms:
  nacos:
    server-addr: 192.168.2.10:8848
    namespace: 56c8a55c-34c0-4ad5-8621-73c960de4a53
    group: DEFAULT_GROUP
    username: nacos
    password: xksmsxksms
  auth:
    issuer: http://localhost:${server.port}
    default-tenant: public
    tenants:
      - id: public
        name: 公共云默认租户
        enabled: true
        clients:
          - client-id: messaging-client
            client-secret: messaging-secret
            grant-types:
              - authorization_code
              - refresh_token
              - client_credentials
            scopes:
              - openid
              - profile
              - message.read
              - message.write
            redirect-uris:
              - http://127.0.0.1:8080/login/oauth2/code/messaging-client-oidc
              - http://127.0.0.1:8080/authorized
            require-authorization-consent: true
            token:
              access-token-ttl: PT30M
              refresh-token-ttl: P1D
        bootstrap-users:
          - user-id: 1
            username: admin
            password: Admin@123
            authorities:
              - ROLE_PLATFORM_ADMIN
              - message.read
              - message.write
      - id: acme
        name: Acme 企业租户
        enabled: true
        clients:
          - client-id: acme-portal
            client-secret: acme-secret
            grant-types:
              - authorization_code
              - refresh_token
            scopes:
              - openid
              - profile
              - acme.dashboard
            redirect-uris:
              - https://acme.example.com/login/oauth2/code/portal
            require-authorization-consent: true
            require-proof-key: true
        bootstrap-users:
          - user-id: 2001
            username: acme-admin
            password: Admin@123
            authorities:
              - ROLE_TENANT_ADMIN
              - acme.dashboard


