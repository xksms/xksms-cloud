version: '3.8'

# XKSMS-Cloud 生产环境 Docker Compose 配置
# 假设镜像已在本地构建完成并上传到服务器

services:
  # ==================== 基础设施 ====================

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: xksms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: xksms_auth
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - /opt/xksms-cloud/docker/mysql/data:/var/lib/mysql
      - /opt/xksms-cloud/docker/mysql/conf:/etc/mysql/conf.d
    networks:
      - xksms-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xksms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - /opt/xksms-cloud/docker/redis/data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    networks:
      - xksms-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis123}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nacos 注册中心 & 配置中心
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: xksms-nacos
    restart: always
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_SERVICE_PORT=3306
      - JVM_XMS=512m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /opt/xksms-cloud/docker/nacos/logs:/home/nacos/logs
    networks:
      - xksms-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== 应用服务 ====================

  # 网关服务
  gateway:
    image: ${REGISTRY:-local}/xksms-gateway:${VERSION:-1.0.0}
    container_name: xksms-gateway
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xksms_auth?useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xksms-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/xksms-cloud/logs/gateway:/app/logs

  # 认证授权服务
  auth:
    image: ${REGISTRY:-local}/xksms-auth:${VERSION:-1.0.0}
    container_name: xksms-auth
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xksms_auth?useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - xksms-network
    volumes:
      - /opt/xksms-cloud/logs/auth:/app/logs

  # 用户服务
  user:
    image: ${REGISTRY:-local}/xksms-user:${VERSION:-1.0.0}
    container_name: xksms-user
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xksms_user?useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
    ports:
      - "8082:8082"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xksms-network
    volumes:
      - /opt/xksms-cloud/logs/user:/app/logs

  # 系统服务
  system:
    image: ${REGISTRY:-local}/xksms-system:${VERSION:-1.0.0}
    container_name: xksms-system
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/xksms_system?useSSL=false&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
    ports:
      - "8083:8083"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - xksms-network
    volumes:
      - /opt/xksms-cloud/logs/system:/app/logs

  # 通知服务
  notify:
    image: ${REGISTRY:-local}/xksms-notify:${VERSION:-1.0.0}
    container_name: xksms-notify
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_SERVER_ADDR=nacos:8848
    ports:
      - "8084:8084"
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - xksms-network
    volumes:
      - /opt/xksms-cloud/logs/notify:/app/logs

networks:
  xksms-network:
    driver: bridge
