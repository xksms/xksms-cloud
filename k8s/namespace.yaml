---
# XKSMS-Cloud Kubernetes 命名空间定义
apiVersion: v1
kind: Namespace
metadata:
  name: xksms-cloud
  labels:
    name: xksms-cloud
    app: xksms

---
# 配置字典 - Nacos 地址
apiVersion: v1
kind: ConfigMap
metadata:
  name: xksms-config
  namespace: xksms-cloud
data:
  NACOS_SERVER_ADDR: "nacos-standalone:8848"
  SPRING_PROFILES_ACTIVE: "prod"
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"

---
# 密钥配置 - 数据库密码等敏感信息
apiVersion: v1
kind: Secret
metadata:
  name: xksms-secrets
  namespace: xksms-cloud
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root123"
  MYSQL_USERNAME: "root"
  MYSQL_PASSWORD: "root123"
