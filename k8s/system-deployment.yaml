---
# XKSMS-System Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xksms-system
  namespace: xksms-cloud
  labels:
    app: xksms-system
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xksms-system
      version: v1
  template:
    metadata:
      labels:
        app: xksms-system
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: system
          image: xksms-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: xksms-config
                  key: SPRING_PROFILES_ACTIVE
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: xksms-config
                  key: NACOS_SERVER_ADDR
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-host:3306/xksms_system?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xksms-secrets
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xksms-secrets
                  key: MYSQL_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
# XKSMS-System Service
apiVersion: v1
kind: Service
metadata:
  name: xksms-system
  namespace: xksms-cloud
  labels:
    app: xksms-system
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  selector:
    app: xksms-system
