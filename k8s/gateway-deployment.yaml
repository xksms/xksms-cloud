---
# XKSMS-Gateway Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xksms-gateway
  namespace: xksms-cloud
  labels:
    app: xksms-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xksms-gateway
      version: v1
  template:
    metadata:
      labels:
        app: xksms-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: gateway
          image: xksms-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: xksms-config
                  key: SPRING_PROFILES_ACTIVE
            - name: NACOS_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: xksms-config
                  key: NACOS_SERVER_ADDR
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - xksms-gateway
                topologyKey: kubernetes.io/hostname

---
# XKSMS-Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: xksms-gateway
  namespace: xksms-cloud
  labels:
    app: xksms-gateway
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: xksms-gateway

